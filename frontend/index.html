<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prem Predictor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* palette validated (dataviz six checks, light surface):
     home #2563eb · draw #0d9488 · away #ea580c */
  /* dark palette validated (dataviz six checks, dark surface):
     home #5b8ef8 · draw #0d9488 · away #ea580c */
  :root {
    --bg:#0b0e14; --card:#141a24; --line:#232b38; --line2:#31394a;
    --ink:#e8ecf4; --ink2:#a5aec0; --ink3:#67718a;
    --home:#5b8ef8; --draw:#0d9488; --away:#ea580c;
    --home-t:#16233f; --draw-t:#0e2723; --away-t:#331a0c;
    --warn:#e8b33d; --warn-t:#2a2410;
    --r:12px; --shadow:0 1px 2px rgba(0,0,0,.35);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.5 "Inter", system-ui, -apple-system, sans-serif; }
  a { color:var(--home); text-decoration:none; }

  header { position:sticky; top:0; z-index:5; background:var(--card);
           border-bottom:1px solid var(--line); }
  .h-top { max-width:1020px; margin:0 auto; padding:12px 20px;
           display:flex; align-items:center; gap:18px; }
  .logo { font-weight:800; font-size:17px; letter-spacing:-.3px; }
  .logo span { color:var(--home); }
  .h-top .spacer { flex:1; }
  .h-top a.perf { font-weight:600; font-size:13px; color:var(--ink2); }
  .h-top a.perf:hover { color:var(--ink); }
  .gw-strip { max-width:1020px; margin:0 auto; padding:0 14px 10px;
              display:flex; gap:6px; overflow-x:auto; scrollbar-width:thin; }
  .gw-pill { flex:0 0 auto; border:1px solid var(--line); background:var(--card);
             color:var(--ink2); border-radius:999px; padding:4px 13px;
             font-size:13px; font-weight:600; cursor:pointer; }
  .gw-pill:hover { border-color:var(--line2); color:var(--ink); }
  .gw-pill.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }

  .context { max-width:1020px; margin:14px auto 0; padding:0 20px;
             font-size:12.5px; color:var(--ink2); }
  .statbar { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  @media (max-width:700px){ .statbar { grid-template-columns:repeat(2,1fr); } }
  .stat { background:var(--card); border:1px solid var(--line);
          border-radius:10px; padding:9px 12px; }
  .stat .k { font-size:10.5px; font-weight:700; color:var(--ink3);
             text-transform:uppercase; letter-spacing:.5px; }
  .stat .v { font-size:20px; font-weight:800; letter-spacing:-.5px;
             color:var(--ink); line-height:1.25; }
  .stat .v.good { color:#5ad19a; }
  .stat .s { font-size:11px; color:var(--ink3); }
  .ctx-note { margin:9px 0 0; color:var(--ink3); max-width:72ch; }
  main { max-width:1020px; margin:10px auto 40px; padding:0 20px;
         display:grid; grid-template-columns:repeat(auto-fill,minmax(460px,1fr));
         gap:14px; }
  @media (max-width:1000px){ main { grid-template-columns:1fr; } }

  .fx { display:block; color:inherit; background:var(--card);
        border:1px solid var(--line); border-radius:var(--r);
        box-shadow:var(--shadow); padding:16px 16px 12px;
        transition:border-color .12s, transform .12s; }
  .fx:hover { border-color:var(--line2); transform:translateY(-1px); }
  .fx:active { transform:none; }
  .fx .go { font-size:12px; font-weight:600; color:var(--ink3); }
  .fx:hover .go { color:var(--home); }
  .fx-top { display:flex; align-items:center; justify-content:space-between;
            gap:8px; margin-bottom:12px; }
  .when { font-size:12px; color:var(--ink3); font-weight:500; }
  .mode { font-size:11px; font-weight:700; letter-spacing:.5px;
          text-transform:uppercase; padding:3px 9px; border-radius:999px; }
  .mode.provisional { background:#1d2340; color:#9db2f5; }
  .mode.final { background:#0e2a1e; color:#5ad19a; }
  .mode.manual { background:#2a2410; color:#e8c064; }
  .mode.none { background:#1a2029; color:var(--ink3); }

  .teams { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .team { display:flex; align-items:center; gap:9px; flex:1; min-width:0; }
  .team.away { flex-direction:row-reverse; text-align:right; }
  .crest { width:34px; height:34px; flex:0 0 auto; object-fit:contain; }
  .mono { width:34px; height:34px; border-radius:50%; background:var(--bg);
          border:1px solid var(--line); display:flex; align-items:center;
          justify-content:center; font-weight:700; font-size:13px;
          color:var(--ink2); flex:0 0 auto; }
  .tname { font-weight:700; font-size:15px; letter-spacing:-.2px;
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .txg { font-size:11.5px; color:var(--ink3); }
  .vs { color:var(--ink3); font-size:12px; font-weight:600; }

  .prices { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;
            margin-bottom:10px; }
  .price { border-radius:10px; padding:8px 6px 7px; text-align:center;
           border:1px solid var(--line); }
  .price .lbl { font-size:10.5px; font-weight:600; color:var(--ink2);
                letter-spacing:.2px; white-space:nowrap; overflow:hidden;
                text-overflow:ellipsis; }
  .price .val { font-size:19px; font-weight:800; letter-spacing:-.5px; }
  .price.h { background:var(--home-t); border-color:#243a63; }
  .price.h .val { color:var(--home); }
  .price.d { background:var(--draw-t); border-color:#164a42; }
  .price.d .val { color:#2eb8a5; }
  .price.a { background:var(--away-t); border-color:#57301a; }
  .price.a .val { color:#f97b3d; }
  .price .mkt { font-size:10.5px; color:var(--ink3); margin-top:1px; }

  .bar { display:flex; height:8px; border-radius:4px; overflow:hidden;
         gap:2px; background:var(--card); margin-bottom:10px; }
  .bar div { border-radius:2px; }
  .bar .h { background:var(--home); } .bar .d { background:var(--draw); }
  .bar .a { background:var(--away); }

  .meta { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px;
          color:var(--ink2); align-items:center; }
  .meta .sc { color:var(--ink2); }
  .meta .sc b { color:var(--ink); font-weight:700; }

  /* Three separate claims, ranked by how much confidence each deserves:
     the result probability is the prediction, the single most likely
     scoreline is a curiosity, and the distribution is the honest picture. */
  .slab { font-size:10.5px; font-weight:700; color:var(--ink3);
          text-transform:uppercase; letter-spacing:.5px; margin-bottom:5px; }
  .sect { margin-top:11px; padding-top:10px; border-top:1px solid var(--line); }
  .headline { font-size:23px; font-weight:800; letter-spacing:-.6px;
              line-height:1.2; margin-bottom:10px;
              font-variant-numeric:tabular-nums; }
  .headline.h { color:var(--home); }
  .headline.d { color:#2eb8a5; }
  .headline.a { color:#f97b3d; }
  .single { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .single .sv { font-size:15px; font-weight:700; color:var(--ink2);
                font-variant-numeric:tabular-nums; }
  .single .sn { font-size:11.5px; color:var(--ink3); }
  .dist { display:flex; flex-wrap:wrap; gap:6px; }
  .dist .d1 { font-size:12px; color:var(--ink2); background:var(--bg);
              border:1px solid var(--line); border-radius:6px; padding:3px 8px;
              font-variant-numeric:tabular-nums; }
  .dist .d1 b { color:var(--ink); font-weight:700; }
  .warnrow { margin-top:8px; background:var(--warn-t); color:var(--warn);
             border-radius:8px; padding:6px 10px; font-size:12px; }
  .fx-foot { display:flex; justify-content:space-between; align-items:center;
             margin-top:10px; padding-top:9px; border-top:1px solid var(--line); }
  details summary { cursor:pointer; font-size:12.5px; font-weight:600;
                    color:var(--ink2); list-style:none; }
  details summary::after { content:" ▾"; color:var(--ink3); }
  details[open] summary::after { content:" ▴"; }
  button { background:var(--card); color:var(--ink2); border:1px solid var(--line);
           border-radius:8px; padding:5px 11px; font:inherit; font-size:12.5px;
           font-weight:600; cursor:pointer; }
  button:hover { border-color:var(--line2); color:var(--ink); }
  button.primary { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  /* Cancel reads as the discarding action, so it should not look like a
     neutral twin of the save button sitting next to it */
  button.cancel { color:#f0806a; border-color:#4a2a24; }
  button.cancel:hover { color:#ff9a83; border-color:#6b3a30; }

  .xi { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:10px;
        font-size:12.5px; }
  .xi ul { list-style:none; margin:6px 0 0; padding:0; }
  .xi li { display:flex; justify-content:space-between; gap:6px; padding:2px 0;
           border-bottom:1px dashed var(--line); align-items:center; }
  .face { width:22px; height:22px; border-radius:50%; object-fit:cover;
          object-position:top; background:var(--line); vertical-align:middle;
          flex:0 0 auto; }
  /* initials stand in when the PL photo CDN has no image for a player */
  .ini { display:inline-flex; align-items:center; justify-content:center;
         font-size:9px; font-weight:800; color:var(--ink2);
         letter-spacing:.2px; }
  .pos { display:inline-block; width:30px; color:var(--ink3); font-size:11px; }
  .tier { font-weight:700; color:var(--ink2); }
  .fat-hi { color:#f87171; font-weight:700; }
  .fat-md { color:var(--warn); font-weight:600; }
  .fat-lo { color:var(--ink3); }
  .provtag { color:var(--ink3); font-style:italic; font-size:11px; }
  .footnote { font-size:11.5px; color:var(--ink3); margin-top:8px; }

  dialog { background:var(--card); color:var(--ink); border:1px solid var(--line);
           border-radius:14px; max-width:900px; width:96%; padding:18px;
           box-shadow:0 10px 40px rgba(16,24,40,.18); }
  dialog::backdrop { background:rgba(16,24,40,.45); }
  .cnt { font-size:12px; color:var(--ink3); }

</style>
</head>
<body>
<header>
  <div class="h-top">
    <div class="logo">Prem<span>Predictor</span></div>
    <div class="spacer"></div>
    <a class="perf" href="/performance">Model performance →</a>
  </div>
  <div class="gw-strip" id="gw-strip"></div>
</header>

<div class="context">
  <div class="statbar" id="statbar"></div>
  <p class="ctx-note">Backtested across all 380 matches of 2025-26, refitting
  each week and only ever training on matches already played. These are
  probabilities, not forecasts — a 60% pick is meant to lose 4 times in 10.
  <a href="/performance">See what it gets wrong →</a></p>
</div>

<main id="fixtures">loading…</main>



<script>
let CUR_GW = null;
const pct = x => Math.round(100 * x) + '%';
// scoreline probabilities sit in the 5-15% band, where rounding to whole
// percent throws away the ordering that makes the distribution readable
const pct1 = x => (100 * x).toFixed(1) + '%';

// The headline claim: which of the three results the model favours, and by
// how much. Deliberately NOT the exact scoreline — see the note in render().
function resultCall(p, home, away) {
  const opts = [
    { k: 'h', label: `${home} win`, p: p.p_home },
    { k: 'd', label: 'Draw', p: p.p_draw },
    { k: 'a', label: `${away} win`, p: p.p_away },
  ];
  return opts.sort((x, y) => y.p - x.p)[0];
}

function gwStrip(cur) {
  const el = document.getElementById('gw-strip');
  el.innerHTML = '';
  for (let i = 1; i <= 38; i++) {
    const b = document.createElement('button');
    b.className = 'gw-pill' + (i === cur ? ' on' : '');
    b.textContent = 'GW ' + i;
    b.onclick = () => loadGw(i);
    el.appendChild(b);
  }
  const on = el.querySelector('.on');
  if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
}

async function loadGw(gw) {
  const r = await fetch(`/api/gameweek/${gw}`);
  const data = await r.json();
  CUR_GW = data.gameweek;
  gwStrip(CUR_GW);
  render(data);
}

function crest(t) {
  if (t.crest) return `<img class="crest" src="${t.crest}" alt="" loading="lazy"
    onerror="this.outerHTML='<div class=mono>${t.name.slice(0,2)}</div>'">`;
  return `<div class="mono">${t.name.slice(0, 2)}</div>`;
}

function fatCls(f) { return f >= 70 ? 'fat-hi' : f >= 50 ? 'fat-md' : 'fat-lo'; }

// The PL photo CDN has no image for many squad players (it answers 403), so
// every avatar falls back to the player's initials rather than a blank disc.
function initials(name) {
  const parts = (name || '?').trim().split(/\s+/);
  const first = parts[0][0] || '?';
  const last = parts.length > 1 ? parts[parts.length - 1][0] : '';
  return (first + last).toUpperCase();
}
function avatarFail(el, ini) {
  const s = document.createElement('span');
  s.className = el.className + ' ini';
  s.textContent = ini;
  el.replaceWith(s);
}
function avatar(p, cls) {
  const ini = initials(p.name);
  if (!p.photo) return `<span class="${cls} ini">${ini}</span>`;
  return `<img class="${cls}" src="${p.photo}" alt="" loading="lazy"
     onerror="avatarFail(this,'${ini}')">`;
}


function kickoff(d) {
  if (!d) return 'TBC';
  return new Date(d.replace(' ', 'T') + 'Z').toLocaleString([], {
    weekday: 'short', day: 'numeric', month: 'short',
    hour: '2-digit', minute: '2-digit' });
}

function render(data) {
  const el = document.getElementById('fixtures');
  if (!data.fixtures.length) { el.textContent = 'no fixtures'; return; }
  el.innerHTML = data.fixtures.map(f => {
    const p = f.prediction;
    const mode = f.lineup_mode === 'manual' ? 'manual' : (p ? p.tag : 'none');
    const mkt = f.odds ? f.odds.implied : null;

    let mid = `<div class="provtag" style="margin-bottom:6px">no prediction yet
      — run refresh_week.py</div>`;
    if (p) {
      // Three sections, ranked by how much weight each deserves. The result
      // probability is the actual prediction and carries the visual weight;
      // the single most likely scoreline is only ever ~12-15% likely, so it
      // is shown small and labelled for what it is; the distribution behind
      // it makes plain that the top scoreline barely leads the field.
      const call = resultCall(p, f.home.name, f.away.name);
      const top = p.top_scores || [];
      mid = `
      <div class="slab">Result</div>
      <div class="headline ${call.k}">${call.label} — ${pct(call.p)}</div>
      <div class="prices">
        <div class="price h"><div class="lbl">${f.home.name}</div>
          <div class="val">${pct(p.p_home)}</div>
          ${mkt ? `<div class="mkt">mkt ${pct(mkt[0])}</div>` : ''}</div>
        <div class="price d"><div class="lbl">Draw</div>
          <div class="val">${pct(p.p_draw)}</div>
          ${mkt ? `<div class="mkt">mkt ${pct(mkt[1])}</div>` : ''}</div>
        <div class="price a"><div class="lbl">${f.away.name}</div>
          <div class="val">${pct(p.p_away)}</div>
          ${mkt ? `<div class="mkt">mkt ${pct(mkt[2])}</div>` : ''}</div>
      </div>
      <div class="bar" title="home / draw / away">
        <div class="h" style="flex:${p.p_home}"></div>
        <div class="d" style="flex:${p.p_draw}"></div>
        <div class="a" style="flex:${p.p_away}"></div>
      </div>
      <div class="sect">
        <div class="slab">Most likely single scoreline</div>
        <div class="single">
          <span class="sv">${top.length ? top[0].score : '—'}</span>
          <span class="sn">${top.length ? pct1(top[0].p) : ''} — highest of many
          close options, not a confident call</span>
        </div>
      </div>
      <div class="sect">
        <div class="slab">Scoreline distribution</div>
        <div class="dist">${top.slice(0, 5).map(s =>
          `<span class="d1"><b>${s.score}</b> ${pct1(s.p)}</span>`).join('')}</div>
      </div>
      ${!f.odds ? '<div class="meta" style="margin-top:8px"><span>no market odds</span></div>' : ''}`;
      // Data-quality warnings are no longer shown on the card — they crowded
      // the gameweek list. They still appear in full on the match page, which
      // is where the detail belongs.
    }

    // The whole card is the link. Lineups, ratings and the XI editor moved to
    // the match page, so nothing else on the card is clickable and a separate
    // "match page →" link was only ever a smaller target for the same action.
    return `<a class="fx" href="/match?id=${f.id}">
      <div class="fx-top">
        <span class="when">${kickoff(f.date)}</span>
        <span class="mode ${mode}">${mode}</span>
      </div>
      <div class="teams">
        <div class="team">${crest(f.home)}
          <div style="min-width:0"><div class="tname">${f.home.name}</div>
          ${p ? `<div class="txg">xG ${p.home_xg.toFixed(2)}</div>` : ''}</div></div>
        <span class="vs">vs</span>
        <div class="team away">${crest(f.away)}
          <div style="min-width:0"><div class="tname">${f.away.name}</div>
          ${p ? `<div class="txg">xG ${p.away_xg.toFixed(2)}</div>` : ''}</div></div>
      </div>
      ${mid}
      <div class="fx-foot">
        <span class="go">Lineups, scorelines &amp; reasoning →</span>
      </div>
    </a>`;
  }).join('');
}

// Headline numbers come from the same backtest the performance page reports,
// so they cannot drift from the model actually running. This used to be a
// hardcoded "~47%", which had been wrong since the model improved.
fetch('/api/performance').then(r => r.json()).then(d => {
  // the shipping model is Layer 1; the style variant is kept only as a
  // comparison and is switched off
  const b = (d.backtests || []).find(x => !/style/i.test(x.label));
  if (!b) return;
  const stat = (k, v, s, good) =>
    `<div class="stat"><div class="k">${k}</div>
     <div class="v${good ? ' good' : ''}">${v}</div>
     <div class="s">${s}</div></div>`;
  document.getElementById('statbar').innerHTML =
    stat('Called correctly', (100 * b.accuracy).toFixed(1) + '%',
         'home, draw or away', true) +
    stat('Coin-toss floor', '33%', 'what guessing would give') +
    stat('Bookmakers', '49.5%', 'closing odds, same matches') +
    stat('Brier score', b.brier.toFixed(3), 'calibration, lower is better');
}).catch(() => {});

fetch('/api/gameweek/1').then(r => r.json())
  .then(d => loadGw(d.next_gameweek || 1));
</script>
</body>
</html>
