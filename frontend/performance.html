<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prem Predictor — Model Performance</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg:#0b0e14; --card:#141a24; --line:#232b38; --ink:#e8ecf4;
    --ink2:#a5aec0; --ink3:#67718a; --home:#5b8ef8; --good:#5ad19a;
    --bad:#f87171; --warn:#e8b33d; --warn-t:#2a2410;
    --shadow:0 1px 2px rgba(0,0,0,.35);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.55 "Inter", system-ui, sans-serif; }
  header { background:var(--card); border-bottom:1px solid var(--line);
           padding:12px 20px; position:sticky; top:0; }
  .hwrap { max-width:900px; margin:0 auto; display:flex; gap:16px;
           align-items:baseline; }
  .logo { font-weight:800; font-size:17px; letter-spacing:-.3px; }
  .logo span { color:var(--home); }
  header a { color:var(--ink2); text-decoration:none; font-weight:600;
             font-size:13px; }
  header a:hover { color:var(--ink); }
  main { max-width:900px; margin:18px auto 40px; padding:0 20px; }
  .card { background:var(--card); border:1px solid var(--line);
          border-radius:12px; box-shadow:var(--shadow);
          padding:16px 18px; margin-bottom:14px; overflow-x:auto; }
  h2 { font-size:15px; margin:0 0 10px; letter-spacing:-.2px; }
  p { color:var(--ink2); }
  table { border-collapse:collapse; width:100%; font-size:13.5px; }
  th,td { text-align:left; padding:6px 12px 6px 0;
          border-bottom:1px solid var(--line); }
  th { color:var(--ink3); font-weight:600; font-size:12px;
       text-transform:uppercase; letter-spacing:.4px; }
  .flag { color:var(--warn); font-size:13px; }
  .good { color:var(--good); font-weight:600; }
  .bad { color:var(--bad); font-weight:600; }
  .cnt { color:var(--ink3); font-size:12.5px; }
  .calbar { display:inline-block; height:9px; background:var(--home);
            vertical-align:middle; border-radius:2px; }
  .calbar.actual { background:#2eb8a5; }
  ul { color:var(--ink2); }
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="logo">Prem<span>Predictor</span></div>
  <a href="/">← gameweek view</a>
</div></header>
<main id="main">loading…</main>
<script>
fetch('/api/performance').then(r => r.json()).then(d => {
  let html = `<div class="card">
  <h2>What the model has actually earned</h2>
  <p>All numbers are from a walk-forward backtest of the full 2025-26 season
  (model refit weekly on past matches only, never shuffled). Uniform guessing
  scores: accuracy 33%, Brier 0.667, log-loss 1.099. A typical bookmaker sits
  around 53-55% accuracy — this model does not beat the market and is not
  meant to.</p></div>`;

  if (d.backtests.length) {
    const base = d.backtests[0];
    html += `<div class="card"><h2>Layer-by-layer backtest (2025-26)</h2>
    <table><tr><th>variant</th><th>accuracy</th><th>Brier ↓</th>
    <th>log-loss ↓</th><th>verdict vs Layer 1</th></tr>` +
    d.backtests.map((b, i) => {
      let verdict = '—';
      if (i > 0) {
        const dl = b.logloss - base.logloss;
        verdict = Math.abs(dl) < 0.003
          ? `<span class="flag">no real improvement (Δlogloss ${dl >= 0 ? '+' : ''}${dl.toFixed(4)}) — kept, not earning its keep</span>`
          : dl < 0 ? `<span class="good">improves (Δ ${dl.toFixed(4)})</span>`
                   : `<span class="bad">worse (Δ +${dl.toFixed(4)})</span>`;
      }
      return `<tr><td>${b.label}</td><td>${(100 * b.accuracy).toFixed(1)}%</td>
        <td>${b.brier.toFixed(4)}</td><td>${b.logloss.toFixed(4)}</td>
        <td>${verdict}</td></tr>`;
    }).join('') + '</table></div>';

    html += `<div class="card"><h2>Calibration — home-win probability
    (${base.label})</h2>
    <table><tr><th>predicted bucket</th><th>n</th><th>predicted</th>
    <th>actual</th><th></th></tr>` +
    base.calibration.map(c => `<tr><td>${c.bucket}</td><td>${c.n}</td>
      <td>${(100 * c.predicted).toFixed(0)}%</td>
      <td>${(100 * c.actual).toFixed(0)}%</td>
      <td><span class="calbar" style="width:${150 * c.predicted}px"></span><br>
      <span class="calbar actual" style="width:${150 * c.actual}px"></span></td>
      </tr>`).join('') +
    `</table><p class="cnt">blue = predicted frequency, teal = actual.
    Matching lengths = well calibrated.</p></div>`;
  }

  html += `<div class="card"><h2>Provisional vs final predictions</h2>`;
  if (d.prov_vs_final) {
    html += `<p>${d.prov_vs_final.fixtures} fixtures have both a provisional
    (ideal XI) and final (confirmed XI) prediction. Average home-win
    probability shift: <strong>${(100 * d.prov_vs_final.avg_home_prob_shift)
    .toFixed(1)} points</strong>. If this stays near zero over the season, the
    two-stage rebuild isn't earning its complexity.</p>`;
  } else {
    html += `<p class="cnt">No fixture has both yet — accumulates once the
    season starts and Mode 2 rebuilds run.</p>`;
  }
  html += '</div>';

  html += `<div class="card"><h2>Known limitations (deliberately not hidden)</h2>
  <ul>
   <li>Lineup/fatigue/travel weighting did <strong>not</strong> improve
   calibration on 2025-26; kept for what-if analysis.</li>
   <li>Layer 2 style adjustment is <strong>switched off</strong>. It used to
   help marginally, but against the corrected Layer 1 it costs accuracy
   (.466 vs .487) — most likely it was compensating for the unshrunk ratings
   and now double-counts a correction Layer 1 already makes.</li>
   <li><strong>A draw is never the model's top pick</strong> — and the draw
   correction does not change that. The drawn scorelines now carry a fitted
   boost plus an out-of-sample scale, which lifted the mean predicted draw from
   .234 to .258 against an actual .274 and improved Brier by .0019. But the
   nearest a draw comes to leading is 6.6 points, and inflating far enough to
   close that makes calibration worse, so roughly a quarter of matches still
   cannot be called correctly by argmax. The correction makes the
   probabilities more honest; it does not raise the hit-rate.</li>
   <li>Best pure-model accuracy on the 2025-26 holdout is <strong>48.7%</strong>.
   For scale, bookmakers' closing odds — the strongest public predictor
   available — score 49.5% on the same 380 matches. Treat 50%+ unassisted
   claims with suspicion.</li>
   <li>Situational "records" (e.g. a team's half-time-lead record) are measured
   but <strong>none feeds a prediction</strong>: none beat its league base rate
   once team strength was controlled for, and half-time state is not knowable
   before kickoff regardless.</li>
   <li>Fatigue uses league minutes only — European/cup midweeks are invisible.</li>
   <li>No true defensive stats; defender ratings proxy from team goals
   conceded + xG buildup.</li>
   <li>Promoted teams start on a "weakest-3 average" prior until they build
   top-flight history.</li>
  </ul></div>`;

  if (d.pull_log.length) {
    html += `<div class="card"><h2>Recent data pulls</h2><table>
    <tr><th>time (UTC)</th><th>source</th><th>ok</th><th>detail</th></tr>` +
    d.pull_log.map(l => `<tr><td>${l.ts.slice(0, 16)}</td><td>${l.source}</td>
      <td>${l.ok ? '<span class="good">ok</span>'
                 : '<span class="bad">fail</span>'}</td>
      <td class="cnt">${l.detail || ''}</td></tr>`).join('') + '</table></div>';
  }
  document.getElementById('main').innerHTML = html;
});
</script>
</body>
</html>
